# Release: push a tag like v1.2.0 on a commit that is on the default branch (main).
#
# 1. Builds the frontend (npm ci, npm run build writes into backend/src/main/resources/static).
# 2. Sets the jar version to the tag, runs the backend tests and packages ONE runnable jar (mvn package).
# 3. Attaches the jar and its SHA-256 to a GitHub release.
# 4. When the AWS release variables are set, uploads the jar to the artifacts bucket through GitHub OIDC and
#    points latest.json at it. The server pulls it from there (deploy/aws/scripts/julebrus-update.sh); nothing
#    reaches into the server.
#
# Repository variables for step 4 (Settings > Secrets and variables > Actions > Variables), see deploy/aws/README.md:
#   AWS_RELEASE_ROLE_ARN   stack output ReleaseUploaderRoleArn
#   AWS_ARTIFACTS_BUCKET   stack output ArtifactsBucketName
# Until both are set, step 4 is skipped and the release only goes to GitHub.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # GitHub OIDC for the AWS upload role
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version, and check that the tag is on the default branch
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::'$GITHUB_REF_NAME' is not a version tag like v1.2.0"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend into the backend's static resources
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package the jar (version = tag)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The pom carries a SNAPSHOT version; the jar is versioned from the tag on this checkout only.
          mvn -B -ntp -f backend/pom.xml versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          # package runs the unit tests first, as ci.yml does.
          mvn -B -ntp -f backend/pom.xml package
          jar="backend/target/julebrus-$VERSION.jar"
          test -f "$jar"
          # The app must serve its own frontend.
          unzip -l "$jar" | grep -q "BOOT-INF/classes/static/index.html"
          mkdir dist
          cp "$jar" "dist/julebrus-$VERSION.jar"
          (cd dist && sha256sum "julebrus-$VERSION.jar" > "julebrus-$VERSION.jar.sha256")

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/julebrus-${{ steps.version.outputs.version }}.jar
            dist/julebrus-${{ steps.version.outputs.version }}.jar.sha256

      - name: AWS credentials (GitHub OIDC)
        if: ${{ vars.AWS_RELEASE_ROLE_ARN != '' && vars.AWS_ARTIFACTS_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to the artifacts bucket and point latest.json at it
        if: ${{ vars.AWS_RELEASE_ROLE_ARN != '' && vars.AWS_ARTIFACTS_BUCKET != '' }}
        env:
          BUCKET: ${{ vars.AWS_ARTIFACTS_BUCKET }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jar="dist/julebrus-$VERSION.jar"
          sha="$(cut -d' ' -f1 "$jar.sha256")"
          aws s3 cp "$jar" "s3://$BUCKET/releases/$VERSION/app.jar"
          # latest.json is written last, so the server never sees a version whose jar is not there yet.
          printf '{"version":"%s","key":"releases/%s/app.jar","sha256":"%s"}' "$VERSION" "$VERSION" "$sha" > latest.json
          aws s3 cp latest.json "s3://$BUCKET/latest.json"
          echo "::notice::Published $VERSION to s3://$BUCKET; the server picks it up on its next update check."

      - name: Note when AWS publishing is not set up
        if: ${{ vars.AWS_RELEASE_ROLE_ARN == '' || vars.AWS_ARTIFACTS_BUCKET == '' }}
        run: echo "::notice::AWS_RELEASE_ROLE_ARN or AWS_ARTIFACTS_BUCKET is not set; the release went to GitHub only."
